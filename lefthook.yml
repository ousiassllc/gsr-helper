pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    lint:
      glob: "*.go"
      run: go tool golangci-lint run
    linterly:
      run: go tool linterly check

pre-push:
  commands:
    test:
      run: go test ./...
