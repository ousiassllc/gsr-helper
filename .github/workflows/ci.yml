name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # self-hosted runner を使うジョブの前段ゲート。GitHub ホストランナーで動かし、
    # 許可したトリガー以外では「失敗」して後続を止める（skip ではないため
    # required status check として fork PR のマージを機械的に止められる）。
    runs-on: ubuntu-latest
    steps:
      - name: トリガーと head リポジトリを検証する
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          case "$EVENT_NAME" in
            push)
              exit 0
              ;;
            pull_request)
              if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
                exit 0
              fi
              echo "fork ($HEAD_REPO) からの PR では self-hosted runner のジョブを実行しない" >&2
              exit 1
              ;;
          esac
          echo "許可していないトリガー ($EVENT_NAME) では self-hosted runner のジョブを実行しない" >&2
          exit 1

  lint:
    needs: guard
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: make linterly

  test:
    needs: guard
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test

  build:
    needs: guard
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
